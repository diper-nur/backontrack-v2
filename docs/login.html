<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | BackOnTrack</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="assets/css/auth.css" rel="stylesheet">
</head>
<body class="text-white min-h-screen flex items-center justify-center">
<div class="w-full max-w-5xl grid md:grid-cols-2 gap-10 items-center px-6">
 <section class="hidden md:block"><a href="index.html" class="text-indigo-400 font-semibold">BackOnTrack</a><h1 class="text-5xl font-bold mb-6 mt-4">Welcome Back</h1><p class="text-gray-300 mb-6">Log in to continue managing tasks, tracking progress, and staying ahead of deadlines.</p><ul class="space-y-3 text-gray-400"><li>Smart task tracking</li><li>AI-powered study help</li><li>Deadline reminders</li></ul></section>
 <section class="backdrop-blur-lg bg-white/10 border border-white/20 rounded-2xl p-8 shadow-xl"><h2 class="text-2xl font-semibold mb-6 text-center">Login to your account</h2>
 <form id="login-form" class="space-y-4">
 <div><label for="email" class="text-sm text-gray-300">Email</label><input id="email" type="email" autocomplete="email" required class="w-full mt-1 px-4 py-2 bg-white/10 border border-white/20 rounded-lg"></div>
 <div><label for="password" class="text-sm text-gray-300">Password</label><input id="password" type="password" autocomplete="current-password" required class="w-full mt-1 px-4 py-2 bg-white/10 border border-white/20 rounded-lg"></div>
 <button id="submit-button" type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold">Login</button></form>
 <p id="status" class="status mt-4" role="status" aria-live="polite"></p>
 <p class="text-center text-gray-400 mt-6 text-sm">Don’t have an account? <a href="register.html" class="text-blue-400 hover:underline">Register</a></p>
 </section>
</div>
<script type="module" src="assets/js/login.js"></script>
</body></html>
