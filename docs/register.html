<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | BackOnTrack</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="assets/css/auth.css" rel="stylesheet"></head>
<body class="text-white min-h-screen flex items-center justify-center">
<div class="w-full max-w-lg px-6"><div class="backdrop-blur-lg bg-white/10 border border-white/20 rounded-2xl p-8 shadow-xl">
<a href="index.html" class="text-indigo-400 font-semibold">BackOnTrack</a><h1 class="text-2xl font-semibold mb-6 mt-4 text-center">Create your account</h1>
<form id="register-form" class="space-y-4">
<div><label for="email" class="text-sm text-gray-300">Email</label><input id="email" type="email" autocomplete="email" required class="w-full mt-1 px-4 py-2 bg-white/10 border border-white/20 rounded-lg"></div>
<div><label for="password" class="text-sm text-gray-300">Password (min. 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required class="w-full mt-1 px-4 py-2 bg-white/10 border border-white/20 rounded-lg"></div>
<div><label for="confirm" class="text-sm text-gray-300">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required class="w-full mt-1 px-4 py-2 bg-white/10 border border-white/20 rounded-lg"></div>
<button id="submit-button" type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Create account</button></form>
<p id="status" class="status mt-4" role="status" aria-live="polite"></p>
<p class="text-center text-gray-400 mt-6 text-sm">Already have an account? <a class="text-blue-400 hover:underline" href="login.html">Login</a></p></div></div>
<script type="module" src="assets/js/register.js"></script>
</body></html>
